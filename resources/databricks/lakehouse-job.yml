resources:
  jobs:
    finance_lakehouse_pipeline:
      name: finance-lakehouse-portfolio
      tasks:
        - task_key: run_pipeline
          spark_python_task:
            python_file: ../../src/lakehouse/pipeline.py
            parameters:
              - --input
              - resources/landing/initial
              - --lakehouse
              - /tmp/lakehouse-finance-portfolio
          new_cluster:
            spark_version: 16.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
